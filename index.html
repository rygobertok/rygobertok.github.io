<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget d'Humeur Interactif</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      transition: background 0.5s ease;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 30px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .emoji {
      font-size: 80px;
      margin: 20px 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    h2 {
      color: #333;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 0.95rem;
      min-height: 50px;
      margin-bottom: 20px;
      font-style: italic;
    }

    .buttons {
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      background: #f0f0f0;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #e0e0e0;
      transform: scale(1.1);
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="card" id="moodCard">
    <div class="emoji" id="emoji">😎</div>
    <h2 id="title">Zen</h2>
    <p id="quote">"Le calme est le berceau de la force."</p>
    <div class="buttons">
      <button onclick="setMood('zen', '😎', 'Zen', '« Le calme est le berceau de la force. »', '#c3cfe2', '#f5f7fa')">😎</button>
      <button onclick="setMood('heureux', '🥳', 'Festif !', '« La vie est une fête permanente. »', '#ffecd2', '#fcb69f')">🥳</button>
      <button onclick="setMood('motivé', '🚀', 'En orbite', '« Vers l\'infini et au-delà ! »', '#a1c4fd', '#c2e9fb')">🚀</button>
      <button onclick="setMood('fatigué', '😴', 'Mode Pause', '« Rien ne vaut une bonne sieste. »', '#cfd9df', '#e2ebf0')">😴</button>
</div>

  </div>

  <script>
    function setMood(mood, emoji, title, quote, color1, color2) {
      document.getElementById('emoji').textContent = emoji;
      document.getElementById('title').textContent = title;
      document.getElementById('quote').textContent = quote;
      
      // Animation de rebond sur l'émoji
      const emojiEl = document.getElementById('emoji');
      emojiEl.style.transform = 'scale(1.3)';
      setTimeout(() => {
        emojiEl.style.transform = 'scale(1)';
      }, 200);

      // Changement du fond de la page
      document.body.style.background = `linear-gradient(135deg, ${color1}, ${color2})`;
    }
  </script>

</body>
</html>
